[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-hilbert-verification"
version = "1.3.0"
description = "Reproducible numerical checks for multilevel log-Hilbert kernel approximation"
requires-python = ">=3.12"
dependencies = ["numpy>=2.3,<3", "scipy>=1.17,<2", "matplotlib>=3.10,<4"]

[project.scripts]
log-hilbert-verify = "log_hilbert_verification.reproduce:main"

[tool.setuptools.packages.find]
include = ["log_hilbert_verification*"]
